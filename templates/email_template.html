<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; color:#f4f4f4;">
    {{ preview_text }}
  </div>

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:30px 0;">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">

          <tr>
            <td align="center" style="padding:20px;">
              <img src="{{ logo_url }}" alt="Logo" width="200" style="display:block; max-width:200px;">
            </td>
          </tr>

          <tr>
            <td>
              <img src="{{ hero_image_url }}" alt="Hero Image" width="600" style="display:block; width:600px; max-width:100%;">
            </td>
          </tr>

          <tr>
            <td style="padding:30px;">
              <h1 style="font-size:28px; color:#222222; margin:0 0 15px;">
                {{ title }}
              </h1>

              <p style="font-size:18px; color:#555555; margin:0 0 25px;">
                {{ subtitle }}
              </p>

              {{ sections_html }}
            </td>
          </tr>

          <tr>
            <td style="padding:20px 30px; font-size:12px; color:#888888; border-top:1px solid #eeeeee;">
              {{ footer_note }}
              <br>
              <a href="{{ unsubscribe_url }}" style="color:#888888;">Unsubscribe</a>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
